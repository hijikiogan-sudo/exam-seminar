name: Build and publish study notes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Japanese print fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Validate reviewed content and build HTML
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/build.py
      - name: Generate print PDF from the same HTML
        run: node scripts/render-pdf.cjs
      - name: Package offline HTML and PDF
        run: python3 scripts/package.py
      - name: Check mobile, tablet, desktop and controls
        run: node scripts/verify.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: exam-seminar-${{ github.sha }}
          path: _site
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
